<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Franchise MJ — Saisie KPI</title>
<style>
/* ============================================================================
   FRANCHISE MJ — Thème partagé (repris de la palette franchise-py)
   Chargé par saisie_lourdes_pouzac.html et dashboard_lourdes_pouzac.html
   ==========================================================================*/
:root {
  --bg: #f0f2f5;
  --card: #ffffff;
  --border: #dde1ea;
  --gold: #b8860b;
  --gold2: #d4a017;
  --text: #1a1d2e;
  --muted: #6b7280;
  --green: #27ae60;
  --red: #c0392b;
}
body.dark-mode {
  --bg: #0f1117;
  --card: #1a1d2e;
  --border: #2e3347;
  --gold: #d4a017;
  --gold2: #e8b820;
  --text: #e8eaf0;
  --muted: #8892a4;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  transition: background .2s, color .2s;
}
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center;
  flex-wrap: wrap; gap: 12px; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; }
.brand-title { font-size: 1.05rem; font-weight: 800; color: var(--text); line-height: 1.2; }
.brand-sub { font-size: .72rem; color: var(--muted); }
.header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ── Barre d'outils (période, actions) ──────────────────────────────── */
.toolbar-group {
  display: flex; align-items: center; background: var(--bg);
  border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px;
}
.toolbar-group button {
  border: none; background: transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 7px; font-size: .78rem; font-weight: 700; cursor: pointer;
}
.toolbar-group button.active { background: var(--card); color: var(--gold); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.toolbar-group button:disabled { opacity: .4; cursor: not-allowed; }
.toolbar-btn {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  padding: 7px 13px; border-radius: 10px; font-size: .78rem; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.toolbar-btn:hover { border-color: var(--gold); }

/* ── Onglets "espaces" (Pilotage Opérationnel, Performance...) ──────── */
   .espace-tabs { display: flex; gap: 8px; padding: 12px 20px 0; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
   .espace-pill {
        display: inline-flex; align-items: center; gap: 8px;
        border: 1.5px solid var(--border); background: var(--card); color: var(--text);
        padding: 6px 16px 6px 6px; border-radius: 13px; font-size: .84rem; font-weight: 700; cursor: pointer;
        transition: border-color .15s, background .15s, color .15s;
   }
   .espace-pill .espace-badge {
        width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; background: var(--e-bg, var(--border)); color: var(--e-color, var(--muted));
   }
   .espace-pill .espace-badge svg { width: 14px; height: 14px; display: block; }
   .espace-pill.active {
        border-color: var(--e-color, var(--gold)); background: var(--e-bg, rgba(184,134,11,.08));
        color: var(--e-color, var(--gold));
   }
   .espace-pill:not(.active):hover { border-color: var(--e-color, var(--gold)); }
   .espace-pill .soon-badge {
        font-size: .58rem; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
        color: var(--muted); background: var(--border); padding: 1px 6px; border-radius: 999px;
   }

   /* ── Onglets restaurant (avec icône arche colorée) ──────────────────── */
   .resto-tabs { display: flex; gap: 8px; padding: 12px 20px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; box-sizing: border-box; }
   .resto-tab {
        display: inline-flex; align-items: center; gap: 8px;
        border: 1.5px solid var(--border); background: var(--card); color: var(--text);
        padding: 6px 14px 6px 6px; border-radius: 12px; font-size: .85rem; font-weight: 700; cursor: pointer;
        transition: border-color .15s, background .15s, color .15s;
   }
   .resto-tab .arch-badge {
        width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
   }
   .resto-tab .arch-badge .arch-icon { width: 15px; height: 11px; }
   .resto-tab.active { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
   .resto-tab:not(.active):hover { border-color: var(--gold); }

/* ── Grille de tuiles catégories (aligné sur le style Franchise PY) ──── */
.category-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 14px; padding: 8px 0 24px;
}
@media (max-width: 760px) { .category-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 480px) { .category-grid { grid-template-columns: repeat(2,1fr); gap:10px; } }
.category-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 24px 12px; border-radius: 16px; cursor: pointer;
  border: 2px solid transparent; background: var(--card);
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  transition: all .22s cubic-bezier(.4,0,.2,1);
  user-select: none; min-height: 110px; text-align: center;
}
.category-tile:hover {
  transform: translateY(-4px); box-shadow: 0 10px 28px rgba(0,0,0,.13);
  border-color: var(--cat-color, var(--gold));
}
.category-tile .cat-icon {
  width: 62px; height: 62px; border-radius: 18px; margin: 0 auto;
  display: flex; align-items: center; justify-content: center; font-size: 26px;
  box-shadow: 0 4px 14px rgba(0,0,0,.1), 0 1px 3px rgba(0,0,0,.06);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
}
.category-tile:hover .cat-icon {
  transform: scale(1.12) translateY(-3px);
  box-shadow: 0 10px 28px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.08);
}
.category-tile .cat-label {
  font-size: .72rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted); text-align: center; transition: color .2s;
  max-width: 100%; overflow-wrap: anywhere;
}
.category-tile:hover .cat-label { color: var(--cat-color, var(--gold)); }
.category-tile .cat-count { font-size: .65rem; color: var(--muted); }

/* ── Fil d'ariane retour ─────────────────────────────────────────────── */
.breadcrumb-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.breadcrumb-back {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  padding: 7px 14px; border-radius: 10px; font-size: .82rem; font-weight: 700; cursor: pointer;
}
.breadcrumb-back:hover { border-color: var(--gold); }
.breadcrumb-title { font-size: 1rem; font-weight: 800; color: var(--text); }

.soon-panel {
  text-align: center; padding: 60px 20px; color: var(--muted);
}
.soon-panel .soon-emoji { font-size: 2.2rem; margin-bottom: 12px; }

.resto-switch {
  display: flex; background: var(--bg); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px; gap: 3px;
}
.resto-switch button {
  border: none; background: transparent; padding: 7px 16px;
  border-radius: 999px; font-size: .82rem; font-weight: 700;
  color: var(--muted); cursor: pointer; transition: all .15s;
}
.resto-switch button.active { background: var(--gold); color: #fff; }

.dark-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card);
  cursor: pointer; font-size: 16px; display: flex;
  align-items: center; justify-content: center;
  transition: border-color .2s, transform .2s;
}
.dark-toggle:hover { border-color: var(--gold); transform: scale(1.05); }

.page-link {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--border); background: var(--card);
  color: var(--gold); text-decoration: none; font-weight: 700;
  font-size: .82rem; padding: 8px 16px; border-radius: 999px;
  transition: border-color .2s;
}
.page-link:hover { border-color: var(--gold); }

main { max-width: 1100px; margin: 0 auto; padding: 20px; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px; margin-bottom: 18px;
}

.sub-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.sub-tabs button {
  border: 1.5px solid var(--border); background: var(--card);
  color: var(--muted); padding: 8px 16px; border-radius: 999px;
  font-size: .82rem; font-weight: 700; cursor: pointer; transition: all .15s;
}
.sub-tabs button.active { border-color: var(--gold); color: var(--gold); background: rgba(184,134,11,.08); }

.form-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .76rem; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea {
  padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--bg); color: var(--text); font-size: .9rem;
  font-family: inherit; outline: none; transition: border-color .2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
.field input[readonly] { color: var(--muted); background: var(--border); cursor: not-allowed; }
.field.wide { grid-column: 1 / -1; }
.field textarea { min-height: 70px; resize: vertical; }
.field .unit-hint { font-size: .68rem; color: var(--muted); margin-top: -2px; }

.form-actions { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
.btn-submit {
  background: var(--gold); color: #fff; border: none; padding: 12px 26px;
  border-radius: 10px; font-size: .9rem; font-weight: 700; cursor: pointer;
  transition: background .2s;
}
.btn-submit:hover { background: var(--gold2); }
.btn-submit:disabled { opacity: .6; cursor: default; }
.form-status { font-size: .82rem; font-weight: 600; }
.form-status.ok { color: var(--green); }
.form-status.err { color: var(--red); }
   .form-status.info { color: var(--gold); }

.section-title {
  font-size: .95rem; font-weight: 800; color: var(--text);
  margin: 0 0 14px; display: flex; align-items: center; gap: 8px;
}
.section-title .freq-badge {
  font-size: .65rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: .5px; color: var(--gold); background: rgba(184,134,11,.1);
  padding: 3px 9px; border-radius: 999px;
}

.kpi-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.kpi-tile {
  position: relative; overflow: hidden;
  border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  background: var(--card);
  transition: border-color .2s, box-shadow .2s;
}
.kpi-tile:hover { border-color: var(--gold2); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.kpi-tile::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--cat-color, var(--gold));
}
.kpi-tile .kpi-label {
  font-size: .72rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px;
}
.kpi-tile .kpi-value { font-size: 1.5rem; font-weight: 700; color: var(--text); line-height: 1; }
.kpi-tile .kpi-value .unit { font-size: .7rem; font-weight: 600; color: var(--muted); margin-left: 3px; }
.kpi-tile .kpi-period { font-size: .68rem; color: var(--muted); margin-top: 6px; }
.kpi-tile.empty .kpi-value { color: var(--muted); font-weight: 600; font-size: .95rem; }

.chart-wrap { height: 220px; margin-bottom: 8px; }

table.data-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
table.data-table th, table.data-table td {
  padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left;
  white-space: nowrap;
}
table.data-table th { color: var(--muted); font-weight: 700; font-size: .7rem; text-transform: uppercase; }
.table-scroll { overflow-x: auto; }

.empty-note { color: var(--muted); font-size: .85rem; padding: 20px 0; text-align: center; }
.config-warning {
  background: #fdf6e3; border: 1.5px solid var(--gold); color: #7a5c00;
  border-radius: 10px; padding: 14px 16px; font-size: .82rem; margin-bottom: 18px;
  line-height: 1.5;
}
body.dark-mode .config-warning { background: rgba(212,160,23,.1); color: var(--gold2); }
.config-warning code {
  background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: .78rem;
}
body.dark-mode .config-warning code { background: rgba(255,255,255,.1); }

/* ── ÉCRAN DE CONNEXION ──────────────────────────────────────────────── */
#login-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
.login-box {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,.12);
  padding: 48px 40px; width: 340px; text-align: center;
}
.login-title { font-size: 1.2rem; font-weight: 800; color: var(--gold); margin-bottom: 4px; }
.login-sub { font-size: .82rem; color: var(--muted); margin-bottom: 28px; }
.login-box input[type=password] {
  width: 100%; padding: 12px 16px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
  font-size: 1rem; outline: none; letter-spacing: 2px;
  box-sizing: border-box; margin-bottom: 12px;
}
.login-box input[type=password]:focus { border-color: var(--gold); }
.login-btn {
  width: 100%; padding: 12px; border-radius: 8px;
  background: var(--gold); color: #fff; border: none;
  font-size: 1rem; font-weight: 700; cursor: pointer;
}
.login-btn:hover { background: var(--gold2); }
.login-error { color: var(--red); font-size: .82rem; margin-top: 10px; min-height: 20px; font-weight: 600; }

/* ── BANNIÈRES D'ACTUALITÉ ──────────────────────────────────────────── */
.banners-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.banner {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 18px; border-radius: 14px;
  border-left: 5px solid var(--gold); background: var(--card);
  border: 1px solid var(--border); border-left: 5px solid var(--gold);
}
.banner-ico {
  width: 36px; height: 36px; border-radius: 10px; background: var(--gold);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.banner-body { flex: 1; min-width: 0; }
.banner-type { font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--gold); margin-bottom: 3px; }
.banner-title { font-size: .9rem; font-weight: 800; color: var(--text); margin-bottom: 3px; }
.banner-msg { font-size: .8rem; color: var(--muted); line-height: 1.5; }
.banner-del {
  cursor: pointer; color: var(--muted); font-size: 1rem; border: none; background: none;
  padding: 2px 6px; border-radius: 6px; flex-shrink: 0;
}
.banner-del:hover { background: var(--bg); color: var(--red); }
.banner-form { display: flex; flex-direction: column; gap: 10px; }
.banner-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
.banner-form-row > * { flex: 1; min-width: 140px; }

/* ── INTERVENTIONS MAINTENANCE ──────────────────────────────────────── */
.interv-list { display: flex; flex-direction: column; gap: 10px; }
.interv-item {
  border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  background: var(--bg);
}
.interv-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
.interv-urg { font-size: .65rem; font-weight: 800; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
.interv-urg.low { background: rgba(39,174,96,.12); color: var(--green); }
.interv-urg.medium { background: rgba(212,160,23,.15); color: var(--gold); }
.interv-urg.high { background: rgba(192,57,43,.12); color: var(--red); }
.interv-tech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.interv-tech-card {
  border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 12px;
  cursor: pointer; font-size: .82rem; text-align: center; transition: all .15s;
}
.interv-tech-card.selected { border-color: var(--gold); background: rgba(184,134,11,.08); color: var(--gold); font-weight: 700; }
.urg-btn-row { display: flex; gap: 8px; }
.urg-btn {
  flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--bg); color: var(--muted); font-size: .82rem; font-weight: 700; cursor: pointer;
}
.urg-btn.sel-low { border-color: var(--green); color: var(--green); background: rgba(39,174,96,.08); }
.urg-btn.sel-medium { border-color: var(--gold); color: var(--gold); background: rgba(184,134,11,.08); }
.urg-btn.sel-high { border-color: var(--red); color: var(--red); background: rgba(192,57,43,.08); }
.setup-note {
  font-size: .75rem; color: var(--muted); background: var(--bg);
  border: 1px dashed var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 10px;
}

@media (max-width: 640px) {
  header { padding: 12px 14px; }
  main { padding: 14px; }
}

</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <div class="brand-title">Franchise MJ</div>
      <div class="brand-sub">Saisie KPI — Lourdes &amp; Pouzac</div>
    </div>
  </div>
  <div class="header-controls">
    <div class="resto-switch" id="restoSwitch"></div>
    <a class="page-link" href="dashboard_lourdes_pouzac.html">Voir le dashboard →</a>
    <button class="dark-toggle" id="darkToggle" title="Basculer le mode sombre">🌙</button>
  </div>
</header>

<main>

  <div id="configWarning" class="config-warning" style="display:none;">
    ⚠️ L'URL de l'Apps Script n'est pas encore configurée. Ouvrez ce fichier et
    remplacez la valeur de <code>APPS_SCRIPT_URL</code> en haut du script par
    l'URL de votre Web App (voir GUIDE_MISE_EN_PLACE.md).
  </div>

  <div class="sub-tabs" id="freqTabs"></div>
  <div class="card">
    <div class="section-title">
      <span id="freqTitle"></span>
      <span class="freq-badge" id="freqBadge"></span>
    </div>
    <form id="entryForm">
      <div class="form-grid" id="formFields"></div>
      <div class="form-actions">
        <button type="submit" class="btn-submit" id="submitBtn">Enregistrer</button>
        <span class="form-status" id="formStatus"></span>
      </div>
    </form>
  </div>

</main>

<script>
/**
 * ============================================================================
 *  FRANCHISE MJ — Référentiel KPI partagé (Lourdes & Pouzac)
 *  Chargé à la fois par saisie_lourdes_pouzac.html et dashboard_lourdes_pouzac.html
 *  pour que les deux pages restent toujours alignées sur les mêmes KPI.
 *
 *  IMPORTANT : si vous ajoutez/renommez un KPI ici, faites le même changement
 *  dans la liste "columns" du bon onglet dans Code.gs (voir ce fichier).
 * ============================================================================
 */

const RESTAURANTS = [
  { id: 'LOURDES', label: 'Lourdes' },
  { id: 'POUZAC',  label: 'Pouzac' }
];

const KPI_CONFIG = {
  quotidien: {
    label: 'Quotidien',
    period: { field: 'date', type: 'date', label: 'Date' },
    kpis: [
      { id: 'ca_net_total',  label: 'CA Net Total',         unit: '€', aggregate: 'sum' },
      { id: 'ca_net_alim',   label: 'CA Net Alimentaire',   unit: '€', aggregate: 'sum' },
      { id: 'transactions',  label: "Transactions (TAC'S)", unit: '',  aggregate: 'sum' },
      { id: 'panier_moyen',  label: 'Panier Moyen (PM)',    unit: '€',
        computed: true, dependsOn: ['ca_net_total', 'transactions'] },
      { id: 'pertes',        label: 'Pertes',               unit: '€', aggregate: 'sum' },
      { id: 'heures_totales',  label: 'Heures Totales',    unit: 'h', aggregate: 'sum' },
      { id: 'heures_equipier', label: 'Heures Équipier',   unit: 'h', aggregate: 'sum' }
    ]
  },
  hebdomadaire: {
    label: 'Hebdomadaire',
    period: { field: 'semaine', type: 'week', label: 'Semaine' },
    kpis: [
      { id: 'oepe',              label: 'OEPE',                          unit: 'sec', aggregate: 'avg' },
      { id: 'r2p',               label: 'R2P (Ready To Present)',        unit: 'sec', aggregate: 'avg' },
      { id: 'oph',               label: 'OPH (Opportunités / 100k)',     unit: '',    aggregate: 'avg' },
      { id: 'hello_mcdo',        label: 'Hello McDo',                    unit: '%',   aggregate: 'avg' },
      { id: 'reseaux_sociaux',   label: 'Réseaux Sociaux',               unit: '',    aggregate: 'avg' },
      { id: 'analyse_silliker',  label: 'Analyse Silliker / Mérieux',    unit: '',    aggregate: 'avg' },

/* ============================================================================
 *  Fonctions utilitaires partagées
 * ==========================================================================*/
function defaultPeriodValue(type) {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  if (type === 'date') {
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }
  if (type === 'month') {
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
  }
  if (type === 'week') {
    const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
  }
  return '';
}

function formatNumber(n) {
  if (typeof n !== 'number') return n;
  return n.toLocaleString('fr-FR', { maximumFractionDigits: 2 });
}

function escapeAttr(str) {
  return String(str || '').replace(/"/g, '&quot;');
}

/**
 * Décale une valeur de période (date / semaine / mois — toutes commencent
 * par une année sur 4 chiffres) d'un certain nombre d'années. Sert à la
 * comparaison N-1 : tant qu'il n'y a pas d'historique, la ligne correspondante
 * n'existe simplement pas encore dans le Sheet et la comparaison reste vide.
 */
function shiftPeriodYear(value, deltaYears) {
  const m = String(value || '').match(/^(\d{4})(.*)$/);
  if (!m) return '';
  return (Number(m[1]) + deltaYears) + m[2];
}

/**
 * Convertit une valeur <input type="week"> ("AAAA-Www") en date du jeudi de
 * cette semaine ISO (norme ISO 8601 : une semaine "appartient" au mois qui
 * contient son jeudi). Sert à savoir à quel mois rattacher une saisie
 * hebdomadaire pour le bilan mensuel.
 */
function isoWeekThursday(weekStr) {
  const m = String(weekStr || '').match(/^(\d{4})-W(\d{2})$/);
  if (!m) return null;
  const year = Number(m[1]), week = Number(m[2]);
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const jan4Day = jan4.getUTCDay() || 7; // lundi=1 … dimanche=7
  const week1Monday = new Date(jan4);
  week1Monday.setUTCDate(jan4.getUTCDate() - (jan4Day - 1));
  const thursday = new Date(week1Monday);
  thursday.setUTCDate(week1Monday.getUTCDate() + (week - 1) * 7 + 3);
  return thursday;
}

/** true si la semaine ISO donnée appartient au mois "AAAA-MM" donné. */
function weekBelongsToMonth(weekStr, monthStr) {
  const thu = isoWeekThursday(weekStr);
  if (!thu) return false;
  const ym = thu.getUTCFullYear() + '-' + String(thu.getUTCMonth() + 1).padStart(2, '0');
  return ym === monthStr;
}

/**
 * Calcule une suggestion de bilan mensuel pour l'onglet "Hebdo — Bilan
 * mensuel" : moyenne (selon la règle "aggregate" de chaque KPI) des saisies
 * hebdomadaires du restaurant courant qui tombent dans le mois choisi.
 * Ne fait rien si aucune semaine du mois n'a encore été saisie.
 */
function suggestHebdoMensuel(monthVal) {
  const cfg = KPI_CONFIG.hebdo_mensuel;
  const status = document.getElementById('formStatus');
  if (!dataCache || !monthVal) return;
  const weekRows = (dataCache.hebdomadaire || []).filter(r =>
    String(r.restaurant) === String(currentResto) && weekBelongsToMonth(r.semaine, monthVal)
  );
  if (!weekRows.length) return;

  cfg.kpis.forEach(k => {
    const vals = weekRows
      .map(r => r[k.id])
      .filter(v => v !== undefined && v !== null && v !== '')
      .map(Number)
      .filter(v => !isNaN(v));
    if (!vals.length) return;
    const sum = vals.reduce((a, b) => a + b, 0);
    const result = k.aggregate === 'sum' ? sum : Math.round((sum / vals.length) * 100) / 100;
    const el = document.getElementById('f_' + k.id);
    if (el) el.value = result;
  });

  const now = new Date();
  const currentYm = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const notTerminated = monthVal >= currentYm;
  status.textContent = `💡 Suggestion calculée à partir de ${weekRows.length} semaine${weekRows.length > 1 ? 's' : ''} saisie${weekRows.length > 1 ? 's' : ''} ce mois-ci — vérifiez puis enregistrez pour finaliser.` +
    (notTerminated ? ' ⚠️ Ce mois n\'est pas encore terminé, toutes les semaines ne sont peut-être pas saisies.' : '');
  status.className = 'form-status info';
}

/**
 * Agrège les lignes de deux restaurants en une seule série "Franchise" par
 * période (somme ou moyenne selon le KPI, recalcul pour les KPI calculés).
 * Pour les KPI ponctuels (événements), pas de fusion par période : on
 * renvoie simplement toutes les lignes des deux restaurants, triées.
 */
function computeFranchiseRows(freq, allRows) {
  const cfg = KPI_CONFIG[freq];
  const rows = allRows || [];

  if (cfg.isEvent) {
    return rows.slice().sort((a, b) => String(a[cfg.period.field]).localeCompare(String(b[cfg.period.field])));
  }

  const byPeriod = {};
  rows.forEach(r => {
    const key = r[cfg.period.field];
    if (!byPeriod[key]) byPeriod[key] = [];
    byPeriod[key].push(r);
  });

  return Object.keys(byPeriod).sort().map(key => {
    const group = byPeriod[key];
    const out = { restaurant: 'FRANCHISE' };
    out[cfg.period.field] = key;

    cfg.kpis.filter(k => !k.computed).forEach(k => {
      const vals = group
        .map(r => r[k.id])
        .filter(v => v !== '' && v !== undefined && v !== null && !isNaN(Number(v)))
        .map(Number);
      if (!vals.length) { out[k.id] = ''; return; }
      const sum = vals.reduce((a, b) => a + b, 0);
      out[k.id] = k.aggregate === 'avg' ? Math.round((sum / vals.length) * 100) / 100 : sum;
    });

    cfg.kpis.filter(k => k.computed).forEach(k => {
      out[k.id] = COMPUTED_KPIS[k.id] ? COMPUTED_KPIS[k.id](out) : '';
    });

    return out;
  });
}

               cfg.kpis.filter(k => k.computed).forEach(k => {
                        const el = document.getElementById('f_' + k.id);
                        if (el) el.value = '';
               });
               status.textContent = '';
               status.className = 'form-status';

               // Onglet "Hebdo — Bilan mensuel" : pas de bilan déjà enregistré pour ce
               // mois → proposer une suggestion calculée à partir des saisies hebdo.
               if (currentFreq === 'hebdo_mensuel') suggestHebdoMensuel(period);
        }
   }

   function renderRestoSwitch() {
        const wrap = document.getElementById('restoSwitch');
        wrap.innerHTML = RESTAURANTS.map(r =>
               `<button data-resto="${r.id}" class="${r.id === currentResto ? 'active' : ''}">${r.label}</button>`
             ).join('');
        wrap.querySelectorAll('button').forEach(btn => {
               btn.addEventListener('click', () => {
                        currentResto = btn.dataset.resto;
                        wrap.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        refreshExistingEntry();
               });
        });
   }

function renderFreqTabs() {
  const wrap = document.getElementById('freqTabs');
  wrap.innerHTML = Object.keys(KPI_CONFIG).map(freq =>
    `<button data-freq="${freq}" class="${freq === currentFreq ? 'active' : ''}">${KPI_CONFIG[freq].label}</button>`
  ).join('');
  wrap.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFreq = btn.dataset.freq;
      wrap.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderForm();
    });
  });
}

function renderForm() {
  const cfg = KPI_CONFIG[currentFreq];
  document.getElementById('freqTitle').textContent = 'Saisie — ' + cfg.label;
  document.getElementById('freqBadge').textContent = cfg.label;

  const fields = [];

  fields.push(`
    <div class="field">
      <label>${cfg.period.label} *</label>
      <input type="${cfg.period.type}" id="f_period" required>
    </div>
  `);

  if (cfg.isEvent) {
    fields.push(`
      <div class="field">
        <label>Type de visite *</label>
        <select id="f_type" required>
          <option value="" disabled selected>Choisir…</option>
          ${cfg.eventTypes.map(t => `<option value="${t}">${t}</option>`).join('')}
        </select>
      </div>
    `);
  }

  cfg.kpis.forEach(k => {
    if (k.computed) {
      fields.push(`
        <div class="field">
          <label>${k.label}${k.unit ? ' (' + k.unit + ')' : ''}</label>
          <input type="text" id="f_${k.id}" data-kpi="${k.id}" readonly placeholder="calculé automatiquement">
        </div>
      `);
    } else {
      fields.push(`
        <div class="field">
          <label>${k.label}${k.unit ? ' (' + k.unit + ')' : ''}</label>
          <input type="number" step="any" id="f_${k.id}" data-kpi="${k.id}">
        </div>
      `);
    }
  });

  (cfg.extraFields || []).forEach(f => {
    const tag = f.type === 'textarea'
      ? `<textarea id="f_${f.id}" data-extra="${f.id}"></textarea>`
      : `<input type="text" id="f_${f.id}" data-extra="${f.id}">`;
    fields.push(`
      <div class="field wide">
        <label>${f.label}</label>
        ${tag}
      </div>
    `);
  });

  document.getElementById('formFields').innerHTML = fields.join('');
  document.getElementById('formStatus').textContent = '';
  document.getElementById('formStatus').className = 'form-status';

const periodInput = document.getElementById('f_period');
     periodInput.value = defaultPeriodValue(cfg.period.type);

     // Dès que la période (ou, pour le Ponctuel, le type de visite) change,
     // vérifier si une saisie existe déjà pour la recharger automatiquement.
     periodInput.addEventListener('change', refreshExistingEntry);
     periodInput.addEventListener('input', refreshExistingEntry);
     if (cfg.isEvent) {
            const typeEl = document.getElementById('f_type');
            if (typeEl) typeEl.addEventListener('change', refreshExistingEntry);
     }

     // Brancher les recalculs automatiques (ex : Panier Moyen = CA Net Total / TAC'S)
     cfg.kpis.filter(k => k.computed).forEach(k => {
            const recompute = () => {
                     const values = {};
                     (k.dependsOn || []).forEach(depId => {
                                const depEl = document.getElementById('f_' + depId);
                                values[depId] = depEl ? depEl.value : '';
                     });
                     const result = COMPUTED_KPIS[k.id] ? COMPUTED_KPIS[k.id](values) : '';
                     document.getElementById('f_' + k.id).value = result;
            };
            (k.dependsOn || []).forEach(depId => {
                     const depEl = document.getElementById('f_' + depId);
                     if (depEl) depEl.addEventListener('input', recompute);
            });
            recompute();
     });

     refreshExistingEntry();
}

async function handleSubmit(e) {
  e.preventDefault();
  const cfg = KPI_CONFIG[currentFreq];
  const submitBtn = document.getElementById('submitBtn');
  const status = document.getElementById('formStatus');

  const payload = {
    frequence: currentFreq,
    restaurant: currentResto
  };
  payload[cfg.period.field] = document.getElementById('f_period').value;

  if (cfg.isEvent) {
    payload.type = document.getElementById('f_type').value;
    if (!payload.type) {
      status.textContent = 'Merci de choisir un type de visite.';
      status.className = 'form-status err';
      return;
    }
  }

  cfg.kpis.forEach(k => {
    const el = document.getElementById('f_' + k.id);
    payload[k.id] = el.value === '' ? '' : Number(el.value);
  });

  (cfg.extraFields || []).forEach(f => {
    payload[f.id] = document.getElementById('f_' + f.id).value;
  });

  if (!payload[cfg.period.field]) {
    status.textContent = 'Merci de renseigner la période.';
    status.className = 'form-status err';
    return;
  }

  submitBtn.disabled = true;
  status.textContent = 'Enregistrement…';
  status.className = 'form-status';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.ok) {
      status.textContent = json.updated ? '✓ Saisie mise à jour.' : '✓ Saisie enregistrée.';
             status.className = 'form-status ok';

             // Mettre à jour le cache local tout de suite, pour que la saisie
             // apparaisse comme "déjà enregistrée" sans attendre un rechargement.
             if (dataCache) {
                        if (!dataCache[currentFreq]) dataCache[currentFreq] = [];
                        const rows = dataCache[currentFreq];
                        const idx = rows.findIndex(r =>
                                     String(r.restaurant) === String(payload.restaurant) &&
                                     String(r[cfg.period.field]) === String(payload[cfg.period.field]) &&
                                     (!cfg.isEvent || String(r.type) === String(payload.type))
                                                           );
                        if (idx > -1) rows[idx] = payload; else rows.push(payload);
             }
    } else {
      status.textContent = 'Erreur : ' + (json.error || 'inconnue');
      status.className = 'form-status err';
    }
  } catch (err) {
    status.textContent = "Erreur d'envoi — vérifiez l'URL Apps Script et la connexion.";
    status.className = 'form-status err';
  } finally {
    submitBtn.disabled = false;
  }
}
</script>
